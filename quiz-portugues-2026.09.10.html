0}%"></span></div><p class="small muted" style="margin:14px 0 0">Faça uma missão de 10 perguntas. Depois, vale uma pausa!</p></aside></section><div class="sectiontitle"><h2>🗺️ Escolha sua próxima missão</h2><span class="muted small">5 temas · 30 perguntas em cada um</span></div><section class="cards">${topics.map((t,i)=>`<button class="card" onclick="topic(${i})" style="--tint:${t.color}"><span class="number">MISSÃO 0${i+1}</span><span class="icon">${t.icon}</span><h3>${t.name}</h3><p class="muted">${t.desc}</p><div class="foot"><span>${done(i)} de 30 exploradas</span><span aria-hidden="true">↗</span></div></button>`).join('')}<button class="card" onclick="review()"><span class="number">TREINO EXTRA</span><span class="icon" style="background:#f8ebba">⭐</span><h3>Vou tentar de novo!</h3><p class="muted">Volte às questões que ainda precisam de uma descoberta.</p><div class="foot"><span>${done()-correct()} para revisar</span><span aria-hidden="true">↗</span></div></button></section><section class="extras"><button class="extra" onclick="puzzle(0)"><strong>🔤 Caça-palavras</strong><span>3 tabuleiros para investigar</span></button><button class="extra" onclick="complete(0)"><strong>✏️ Complete a ideia</strong><span>25 desafios de escrever</span></button><button class="extra" onclick="writing()"><strong>📓 Agora é sobre você</strong><span>Seu autorretrato e sua história</span></button></section><details><summary>Para estudar com um adulto</summary><p>O material acompanha as páginas enviadas: autorretrato (aparência, gostos e jeito), autobiografia (primeira pessoa e sequência temporal), substantivos e quem pratica a ação, adjetivos e origem, L/R depois de consoante na mesma sílaba. As perguntas são atividades novas de revisão; não é preciso decorar os textos do livro.</p><p>Sugestão para hoje: uma rodada de 10 por tema, uma pausa entre rodadas e revisão das dúvidas. As outras rodadas ficam disponíveis para aprofundar. O desafio misturado sorteia 3 perguntas de cada tema. A ordem das alternativas muda, mas cada pergunta tem uma resposta correta.</p><p>O progresso fica neste navegador, quando o armazenamento está disponível. Nada é enviado pela página. Nos campos de completar, respostas equivalentes previstas são aceitas. Se faltar um acento ou uma cedilha, a atividade pede a revisão da escrita antes de contar a resposta como correta.</p><button class="secondary" onclick="if(confirm('Apagar todas as respostas, palavras encontradas e textos salvos?')){saved={answers:{},fills:{},words:{},drafts:{}};save();home()}">Zerar meu progresso</button></details>`)}
function topic(t){const x=topics[t];view(back(x.name)+`<section class="panel"><span class="icon" style="background:${x.color}">${x.icon}</span><div class="eyebrow">Antes de partir</div><h1>${x.name}</h1><div class="lesson"><p>${x.lesson}</p><p>${x.example}</p></div><p>Escolha uma rodada. Leia a explicação antes de seguir!</p><div class="blocks">${[0,1,2].map(b=>`<button onclick="start(questions.filter(q=>q.t===${t}).slice(${b*10},${b*10+10}), '${x.name} · Rodada ${b+1}')">Rodada ${b+1}<span>${b===0?'Primeiras descobertas':b===1?'Olhar de detetive':'Mais um desafio'} · 10 questões</span></button>`).join('')}</div></section>`)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let session=null;function start(qs,title){session={qs:qs.map(q=>({...q,options:shuffle(q.options)})),title,index:0,results:[]};renderQ()}function mixed(){start(shuffle(topics.flatMap((_,t)=>shuffle(questions.filter(q=>q.t===t)).slice(0,3))),'Desafio misturado')}function review(){const qs=questions.filter(q=>saved.answers[q.id]&&!saved.answers[q.id].correct);if(qs.length)start(shuffle(qs),'Vou tentar de novo');else view(back('Revisão')+`<div class="panel empty"><div class="big">⭐</div><h2>${done()?'Tudo revisado por aqui!':'Sua revisão vai aparecer aqui'}</h2><p>${done()?'As questões respondidas estão corretas na última tentativa. Você pode explorar outra rodada.':'Quando uma questão precisar de mais treino, você poderá voltar a ela por aqui.'}</p><button class="primary" onclick="home()">Escolher missão</button></div>`)}
function renderQ(){let s=session,q=s.qs[s.index];view(back(s.title)+`<section class="panel"><div class="qhead"><span>${topics[q.t].icon} ${topics[q.t].name}</span><span>Questão ${s.index+1} de ${s.qs.length}</span></div><div class="track"><span style="width:${s.index/s.qs.length*100}%"></span></div><h2 class="qtext" id="question">${esc(q.q)}</h2><div class="choices" role="group" aria-labelledby="question">${q.options.map((o,i)=>`<button class="choice" id="opt${i}" onclick="answer(${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div></section>`)}function answer(i){let s=session;if(s.results[s.index]!==undefined)return;let q=s.qs[s.index],ok=q.options[i]===q.answer;s.results[s.index]=ok;saved.answers[q.id]={correct:ok};save();q.options.forEach((o,j)=>{let b=document.getElementById('opt'+j);b.disabled=true;if(o===q.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><strong>${ok?'✓ Boa descoberta!':'↻ Vamos aprender com essa!'}</strong><p>${ok?'':`<b>Resposta: ${esc(q.answer)}</b><br>`}${esc(q.explain)}</p><button id="next" class="primary" onclick="next()">${s.index===s.qs.length-1?'Ver minha rodada':'Próxima pergunta →'}</button></div>`;document.getElementById('next').focus({preventScroll:true});if(ok)celebrate('Boa, Miguel! ⭐',25)}function next(){if(session.results[session.index]===undefined)return;if(++session.index<session.qs.length)renderQ();else{let s=session,n=s.results.filter(Boolean).length;celebrate('Missão cumprida! 🏆',65);view(back(s.title)+`<section class="panel result"><div class="big">${n===s.qs.length?'🏆':'🌟'}</div><h1>Missão explorada!</h1><h2>${n} de ${s.qs.length} respostas certas</h2><p>${n===s.qs.length?'Você prestou atenção e conectou as ideias!':'Cada explicação é uma nova descoberta. Vamos treinar o que faltou?'}</p><div class="row" style="justify-content:center">${n<s.qs.length?'<button class="primary" onclick="repeatMistakes()">Rever erros desta rodada</button>':''}<button class="secondary" onclick="home()">Voltar ao mapa</button></div><p class="small muted" style="margin-top:24px">Que tal beber água e descansar um pouquinho?</p></section>`)}}function repeatMistakes(){let s=session;start(s.qs.filter((q,i)=>!s.results[i]),'Revisão desta rodada')}
function complete(t){view(back('Complete a ideia')+`<section class="panel"><h1>✏️ Complete a ideia</h1><p class="muted">Escreva sua resposta. Depois, confira e descubra a explicação.</p><div class="tabs">${topics.map((x,i)=>`<button class="${i===t?'active':''}" onclick="complete(${i})">${x.name}</button>`).join('')}</div><form class="complete-form" onsubmit="checkFills(event,${t})">${fills[t].map((f,i)=>{let v=saved.fills[t+'-'+i];return `<div class="fill-item"><label for="fill${i}">${i+1}. ${esc(f.q)}</label><input id="fill${i}" value="${esc(v?.value||'')}" autocomplete="off" autocapitalize="none" spellcheck="false" oninput="storeFill(${t},${i},this.value)"><div id="resp${i}" class="response" aria-live="polite"></div></div>`}).join('')}<button class="primary" type="submit">Conferir minhas respostas</button><div id="fillSummary" aria-live="polite"></div></form></section>`)}function storeFill(t,i,value){saved.fills[t+'-'+i]={value};save()}function assessFill(f,value){
 const exact=s=>s.trim().normalize('NFC').toLocaleLowerCase('pt-BR').replace(/\s*-\s*/g,'-');
 const choices=[f.a,...(f.alt||[])];
 if(!value.trim())return {status:'empty',answer:f.a};
 const match=choices.find(a=>exact(a)===exact(value));
 if(match!==undefined)return {status:'correct',answer:match};
 const near=choices.find(a=>norm(a)===norm(value));
 if(near!==undefined)return {status:'spelling',answer:near};
 return {status:'incorrect',answer:f.a};
}
function checkFills(e,t){
 e.preventDefault();let count=0,spelling=0;
 fills[t].forEach((f,i)=>{
  const value=document.getElementById('fill'+i).value;
  const result=assessFill(f,value);const ok=result.status==='correct';
  count+=ok?1:0;spelling+=result.status==='spelling'?1:0;
  saved.fills[t+'-'+i]={value,correct:ok,status:result.status};
  const feedback=result.status==='empty'?'Escreva uma resposta para conferir esta atividade.':
   result.status==='correct'?`<strong>✓ Isso mesmo! ${esc(result.answer)}.</strong> ${esc(f.e)}`:
   result.status==='spelling'?`<strong>✏️ Quase lá! Confira os acentos e a cedilha: ${esc(result.answer)}.</strong> Ajuste a escrita e confira de novo. ${esc(f.e)}`:
   `<strong>↻ Vamos aprender: ${esc(result.answer)}.</strong> ${esc(f.e)}`;
  document.getElementById('resp'+i).innerHTML=feedback;
 });
 save();document.getElementById('fillSummary').textContent=`${count} de 5 respostas corretas e com a escrita conferida.${spelling?' Há '+spelling+' resposta(s) para revisar os acentos ou a cedilha.':''} Você pode ajustar e conferir de novo!`;
}

const puzzleSets=[{title:'Letras em dupla',words:['BLUSA','FLAUTA','LIVRO','PRATO','FRUTA','PEDRA','PLUMA','TREM']},{title:'Nomes e características',words:['GATO','CALMO','FLOR','BONITA','MENINO','CURIOSO','LIVRO','NOVO']},{title:'Eu e minha história',words:['VIDA','TEMPO','GOSTOS','OLHOS','CABELOS','INFANCIA','DEPOIS','ESCOLA']}];let puzzleCache={},activePuzzle=0,firstCell=null;function buildPuzzle(k){let seed=7281+k*1237;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};let grid=Array(144).fill(''),paths={};const dirs=[[0,1],[1,0],[1,1]];for(const word of [...puzzleSets[k].words].sort((a,b)=>b.length-a.length)){let placed=false;for(let tries=0;tries<2000;tries++){let [dr,dc]=dirs[Math.floor(rnd()*3)],r=Math.floor(rnd()*12),c=Math.floor(rnd()*12);let endr=r+dr*(word.length-1),endc=c+dc*(word.length-1);if(endr>11||endc>11)continue;let path=Array.from(word,(_,i)=>(r+dr*i)*12+c+dc*i);if(path.every((v,i)=>!grid[v]||grid[v]===word[i])){path.forEach((v,i)=>grid[v]=word[i]);paths[word]=path;placed=true;break}}if(!placed)throw Error('Não foi possível montar o tabuleiro')}for(let i=0;i<144;i++)if(!grid[i])grid[i]='ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(rnd()*26)];return {grid,paths}}function puzzle(k){activePuzzle=k;firstCell=null;if(!puzzleCache[k])puzzleCache[k]=buildPuzzle(k);let {grid}=puzzleCache[k];view(back('Caça-palavras')+`<section class="panel"><h1>🔤 Detetive de palavras</h1><p>Toque na <b>primeira letra</b> e depois na <b>última letra</b> da palavra. Procure na horizontal →, vertical ↓ ou diagonal ↘. Não precisa arrastar!</p><div class="tabs">${puzzleSets.map((p,i)=>`<button class="${i===k?'active':''}" onclick="puzzle(${i})">${p.title}</button>`).join('')}</div><p class="small muted">Neste jogo, as palavras aparecem sem acentos: INFANCIA = infância.</p><div class="puzzle-layout"><div class="grid" aria-label="Tabuleiro de letras">${grid.map((c,i)=>`<button class="cell" id="cell${i}" aria-label="${c}, linha ${Math.floor(i/12)+1}, coluna ${i%12+1}" onclick="selectCell(${i})">${c}</button>`).join('')}</div><div class="wordlist">${puzzleSets[k].words.map(w=>`<span class="word" id="word${w}">${w}</span>`).join('')}</div></div><p class="notice" id="puzzleNotice" aria-live="polite"></p><div class="row"><button class="secondary" onclick="hint()">Uma pista</button><button class="secondary" onclick="firstCell=null;paintPuzzle();document.getElementById('puzzleNotice').textContent='Seleção cancelada. Escolha a primeira letra.'">Cancelar seleção</button></div><p id="wordcount" class="small muted" style="margin-top:18px"></p></section>`);paintPuzzle()}
function paintPuzzle(){let k=activePuzzle,p=puzzleCache[k],found=saved.words[k]||[];p.grid.forEach((_,i)=>{let el=document.getElementById('cell'+i);el.className='cell';if(found.some(w=>p.paths[w]?.includes(i)))el.classList.add('found');if(i===firstCell)el.classList.add('selected')});puzzleSets[k].words.forEach(w=>document.getElementById('word'+w).className='word'+(found.includes(w)?' done':''));document.getElementById('wordcount').textContent=`${found.length} de ${puzzleSets[k].words.length} palavras encontradas.`;if(found.length===puzzleSets[k].words.length)document.getElementById('puzzleNotice').textContent='🏆 Todas encontradas! Você tem um olhar de detetive.'}
function selectCell(i){if(firstCell===null){firstCell=i;paintPuzzle();document.getElementById('puzzleNotice').textContent='Agora toque na última letra da palavra.';return}let begin=firstCell;firstCell=null;let r1=Math.floor(begin/12),c1=begin%12,r2=Math.floor(i/12),c2=i%12,dr=r2-r1,dc=c2-c1;let word=null,found=saved.words[activePuzzle]||[];if(dr===0||dc===0||Math.abs(dr)===Math.abs(dc)){let n=Math.max(Math.abs(dr),Math.abs(dc))+1;let str=Array.from({length:n},(_,j)=>puzzleCache[activePuzzle].grid[(r1+Math.sign(dr)*j)*12+c1+Math.sign(dc)*j]).join('');word=puzzleSets[activePuzzle].words.find(w=>w===str||w===[...str].reverse().join(''))}let msg;if(word){if(found.includes(word))msg='Essa palavra já está no seu passaporte!';else{found.push(word);saved.words[activePuzzle]=found;save();msg=`✓ Você encontrou ${word}!`;celebrate('Palavra descoberta! 🔎',20);}}else msg='Ainda não é uma palavra da lista. Procure uma linha reta e tente de novo.';paintPuzzle();if(found.length<puzzleSets[activePuzzle].words.length)document.getElementById('puzzleNotice').textContent=msg}
function hint(){let k=activePuzzle,w=puzzleSets[k].words.find(w=>!(saved.words[k]||[]).includes(w));if(!w)return;let i=puzzleCache[k].paths[w][0];document.getElementById('puzzleNotice').textContent=`Pista: ${w} começa na linha ${Math.floor(i/12)+1}, coluna ${i%12+1}.`}
function writing(){view(back('Agora é sobre você')+`<section class="panel draft"><h1>📓 Você é o autor!</h1><p>Agora use suas descobertas para escrever. Não existe uma única resposta certa aqui.</p><label for="portrait">Meu autorretrato</label><div class="lesson">Como é sua aparência? Do que você gosta? Como é seu jeito? Comece com “Eu sou Miguel...”.</div><textarea id="portrait" placeholder="Eu sou Miguel..." oninput="saved.drafts.portrait=this.value;save()">${esc(saved.drafts.portrait||'')}</textarea><label for="bio">Um pedacinho da minha autobiografia</label><div class="lesson">Conte três acontecimentos da sua vida, do mais antigo ao mais recente. Use “quando eu era pequeno”, “depois” ou “no ano passado”.</div><textarea id="bio" placeholder="Quando eu era pequeno..." oninput="saved.drafts.bio=this.value;save()">${esc(saved.drafts.bio||'')}</textarea><details open><summary>Confira com um adulto</summary><p>□ Falei de mim usando “eu” ou “meu”?<br>□ No autorretrato, contei aparência, gostos e jeito?<br>□ Na autobiografia, contei acontecimentos em ordem?<br>□ Usei maiúscula no começo e pontuação no final?<br>□ Revisei as palavras com L e R?</p></details><p class="small muted">Os textos ficam guardados neste navegador quando o armazenamento está disponível. A revisão desta atividade é feita com um adulto.</p></section>`)}

let celebrationTimer;
function celebrate(label,amount=30){
 if(saved.motionOff||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
 const layer=document.getElementById('confetti');
 const colors=['#ffe348','#ff4a94','#31def1','#b190ff','#9ff17c','#ff923b'];
 layer.innerHTML=Array.from({length:amount},(_,i)=>`<span class="confetti-piece" style="--x:${Math.random()*100}%;--c:${colors[i%colors.length]};--delay:${Math.random()*.25}s"></span>`).join('')+`<span class="celebration-label">${esc(label)}</span>`;
 clearTimeout(celebrationTimer);celebrationTimer=setTimeout(()=>{layer.innerHTML=''},2100);
}
function applyMotion(){document.body.classList.toggle('motion-off',!!saved.motionOff);const b=document.getElementById('motion-toggle');b.textContent=saved.motionOff?'✨ Animações desligadas':'✨ Animações ligadas';b.setAttribute('aria-pressed',String(!saved.motionOff));if(saved.motionOff)document.getElementById('confetti').innerHTML=''}
function toggleMotion(){saved.motionOff=!saved.motionOff;save();applyMotion()}
applyMotion();

if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_study_progress',description:'Lê o progresso local das missões de português, sem expor os textos pessoais.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({exploradas:done(),corretas:correct(),temas:topics.map((t,i)=>({nome:t.name,exploradas:done(i),corretas:correct(i)}))})})).catch(()=>{})}catch(e){}}home();
</script></body></html>
